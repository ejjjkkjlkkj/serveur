[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accessible-server"
version = "0.1.0"
description = "Serveur Windows administrable au clavier et avec lecteur d'ecran"
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.46.0",
  "platformdirs==4.11.8",
  "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "pyinstaller==6.21.0",
]

[project.scripts]
accessible-server = "accessible_server.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
