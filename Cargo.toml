[package]
name = "accessible-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Serveur Windows natif, securise et accessible aux lecteurs d'ecran"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "derive", "macros", "migrate"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "=0.7.1", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "=5.5.0", features = ["axum_extras"] }

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
